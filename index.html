<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Tag Printer — Version 1 QR Generator</title>
<meta name="theme-color" id="theme-color-meta" content="#EFE6D0" />
<script>
  (function () {
    try {
      var saved = localStorage.getItem('tag-printer-theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE6D0;
    --backdrop:#E3D7B8;
    --card:#FBF8EF;
    --ink:#211D17;
    --ink-soft:#7A705C;
    --stamp:#2B4C7E;
    --stamp-ink:#1F3A61;
    --void:#B23A2E;
    --void-ink:#8C2E24;
    --line:#C9BFA0;
    --line-strong:#B4A986;
    --card-highlight:rgba(255,255,255,.6);
    --card-shadow:rgba(33,29,23,.4);
    --punch-shadow:rgba(33,29,23,.35);
    --qr-shadow:rgba(33,29,23,.4);
    --scrim:rgba(255,255,255,.5);
    color-scheme:light;
  }

  [data-theme="dark"]{
    --paper:#1B1812;
    --backdrop:#121009;
    --card:#26221A;
    --ink:#F2ECDC;
    --ink-soft:#9C927A;
    --stamp:#7CA1D9;
    --stamp-ink:#AFC7EA;
    --void:#E2685A;
    --void-ink:#FF9C90;
    --line:#3C3527;
    --line-strong:#4C4432;
    --card-highlight:rgba(255,255,255,.04);
    --card-shadow:rgba(0,0,0,.55);
    --punch-shadow:rgba(0,0,0,.6);
    --qr-shadow:rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.4);
    color-scheme:dark;
  }

  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#1B1812;
      --backdrop:#121009;
      --card:#26221A;
      --ink:#F2ECDC;
      --ink-soft:#9C927A;
      --stamp:#7CA1D9;
      --stamp-ink:#AFC7EA;
      --void:#E2685A;
      --void-ink:#FF9C90;
      --line:#3C3527;
      --line-strong:#4C4432;
      --card-highlight:rgba(255,255,255,.04);
      --card-shadow:rgba(0,0,0,.55);
      --punch-shadow:rgba(0,0,0,.6);
      --qr-shadow:rgba(0,0,0,.5);
      --scrim:rgba(0,0,0,.4);
      color-scheme:dark;
    }
  }

  body, .phone, .card, .tag-card, .action-bar{
    transition:background-color .2s ease, color .2s ease, border-color .2s ease;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--backdrop);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'IBM Plex Mono',monospace; }

  /* ---------- Phone shell ---------- */
  .phone{
    width:100%;
    max-width:430px;
    min-height:100dvh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  /* The bezel/notch/fixed-height "phone mockup" is a desktop preview affordance only.
     Gating on (pointer:fine) keeps it off real touchscreens -- phones, phablets,
     tablets, and phones in landscape -- which get a native full-bleed layout at
     any width instead. Width alone isn't a safe signal: a phone in landscape or
     a large Android phone can easily exceed 640px. */
  @media (min-width:640px) and (pointer:fine){
    body{ padding:40px 20px; align-items:center; }
    .phone{
      height:min(860px, 94vh);
      min-height:0;
      border-radius:44px;
      overflow:hidden;
      box-shadow:0 40px 80px -30px rgba(20,15,5,.55), 0 0 0 10px #17130f, 0 0 0 11px #000;
    }
    .notch{
      position:absolute; top:14px; left:50%; transform:translateX(-50%);
      width:120px; height:26px; background:#17130f; border-radius:20px; z-index:30;
    }
  }
  .notch{ display:none; }
  @media (min-width:640px) and (pointer:fine){ .notch{ display:block; } }

  /* Real touch devices: respect the safe area (notch / home indicator) at the
     top too -- the bottom action bar already does via env(safe-area-inset-bottom). */
  @media (pointer:coarse), (max-width:639px){
    .app-bar{ padding-top:max(22px, env(safe-area-inset-top)); }
  }

  /* Small phones (e.g. iPhone SE, small Android) -- tighten spacing a touch
     so nothing feels cramped or forces horizontal scroll. */
  @media (max-width:359px){
    .app-bar{ padding-left:16px; padding-right:16px; }
    .phone-content{ padding-left:16px; padding-right:16px; }
    .app-bar h1{ font-size:20px; }
    #data-input{ font-size:17px; padding-right:36px; }
    .segmented button{ font-size:11.5px; padding:8px 2px; }
    .action-bar{ padding-left:16px; padding-right:16px; gap:8px; }
    .btn{ font-size:12.5px; padding:12px 10px; }
  }

  /* Short viewports (landscape phones, small browser windows) -- the layout
     already scrolls internally, but trim vertical rhythm so more fits without
     feeling squeezed. */
  @media (max-height:560px){
    .app-bar{ padding-top:14px; padding-bottom:10px; }
    .app-bar h1{ font-size:19px; }
    .app-bar p{ display:none; }
    .card{ padding:14px; }
    .tag-card{ padding:14px 14px 12px; }
    .qr-wrap{ min-height:140px; min-width:140px; padding:10px; }
    .perf{ margin-top:14px; }
  }

  /* ---------- App bar ---------- */
  .app-bar{
    flex:none;
    padding:22px 20px 16px;
    background:var(--paper);
    position:relative;
    z-index:10;
  }
  @media (min-width:640px) and (pointer:fine){ .app-bar{ padding-top:42px; } }
  .app-bar .eyebrow{
    font-size:11px; letter-spacing:.14em; font-weight:600;
    color:var(--stamp); text-transform:uppercase;
    display:flex; align-items:center; gap:8px;
  }
  .app-bar .eyebrow .dot{
    width:6px; height:6px; border-radius:50%; background:var(--stamp);
  }
  .app-bar h1{
    font-family:'IBM Plex Mono',monospace;
    font-size:22px; font-weight:600; margin:6px 0 0; letter-spacing:-.01em;
  }
  .app-bar p{
    margin:4px 0 0; font-size:13px; color:var(--ink-soft);
  }
  .app-bar-top{ display:flex; align-items:flex-start; justify-content:space-between; }
  .theme-toggle{
    flex:none; width:36px; height:36px; border-radius:50%; border:1px solid var(--line-strong);
    background:var(--card); color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    margin-top:-2px;
  }
  .theme-toggle:hover{ border-color:var(--stamp); }
  .theme-toggle:focus-visible{ outline:2px solid var(--stamp); outline-offset:2px; }
  .theme-toggle svg{ display:block; }
  .theme-toggle .icon-moon{ display:none; }
  [data-theme="dark"] .theme-toggle .icon-sun{ display:none; }
  [data-theme="dark"] .theme-toggle .icon-moon{ display:block; }

  /* ---------- Scroll content ---------- */
  .phone-content{
    flex:1 1 auto;
    overflow-y:auto;
    padding:4px 20px 24px;
    -webkit-overflow-scrolling:touch;
  }

  /* ---------- Card ---------- */
  .card{
    background:var(--card);
    border-radius:18px;
    padding:18px;
    box-shadow:0 1px 0 var(--card-highlight) inset, 0 10px 24px -18px var(--card-shadow);
    border:1px solid var(--line);
  }
  .field-label{
    font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-soft); display:block; margin-bottom:8px;
  }

  /* ---------- Input ---------- */
  .input-row{ position:relative; }
  #data-input{
    width:100%; font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:500;
    letter-spacing:.02em; color:var(--ink); background:#fff;
    border:1.5px solid var(--line-strong); border-radius:12px;
    padding:13px 40px 13px 14px;
    outline:none; transition:border-color .15s ease, box-shadow .15s ease;
  }
  #data-input:focus-visible{
    border-color:var(--stamp); box-shadow:0 0 0 3px rgba(43,76,126,.18);
  }
  #clear-btn{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:28px; height:28px; border-radius:50%; border:none; background:transparent;
    color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  #clear-btn:hover{ background:rgba(33,29,23,.06); }

  .meta-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:10px; font-size:12px; color:var(--ink-soft);
  }
  .mode-pill{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
    letter-spacing:.06em; padding:3px 8px; border-radius:99px;
    background:rgba(43,76,126,.1); color:var(--stamp-ink);
  }

  /* ---------- Capacity bar ---------- */
  .capacity-track{
    margin-top:10px; height:5px; border-radius:99px; background:rgba(33,29,23,.08);
    overflow:hidden;
  }
  .capacity-fill{
    height:100%; border-radius:99px; background:var(--stamp);
    width:0%; transition:width .2s ease, background-color .2s ease;
  }
  .capacity-fill.over{ background:var(--void); }

  /* ---------- Segmented control ---------- */
  .settings-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .segmented{
    display:flex; background:rgba(33,29,23,.06); border-radius:11px; padding:3px; gap:2px;
  }
  .segmented button{
    flex:1; border:none; background:transparent; font-family:'IBM Plex Mono',monospace;
    font-size:12.5px; font-weight:600; letter-spacing:.02em; color:var(--ink-soft);
    padding:8px 4px; border-radius:8px; cursor:pointer;
    transition:background-color .15s ease, color .15s ease, box-shadow .15s ease;
  }
  .segmented button[aria-pressed="true"]{
    background:var(--card); color:var(--stamp-ink);
    box-shadow:0 1px 3px rgba(33,29,23,.18);
  }
  .segmented button:focus-visible{ outline:2px solid var(--stamp); outline-offset:2px; }

  /* ---------- Perforation divider ---------- */
  .perf{
    height:20px; margin:22px -20px 4px; position:relative;
    background-image:radial-gradient(circle, var(--backdrop) 3px, transparent 3.5px);
    background-size:16px 20px; background-position:8px center; background-repeat:repeat-x;
  }
  .perf::before, .perf::after{
    content:""; position:absolute; top:50%; width:14px; height:14px; border-radius:50%;
    background:var(--backdrop); transform:translateY(-50%);
  }
  .perf::before{ left:-7px; }
  .perf::after{ right:-7px; }
  .perf-line{
    position:absolute; left:20px; right:20px; top:50%; border-top:1.5px dashed var(--line-strong);
  }

  /* ---------- Tag / preview card ---------- */
  .tag-card{
    background:var(--card); border-radius:18px; padding:20px 18px 18px;
    box-shadow:0 1px 0 var(--card-highlight) inset, 0 10px 24px -18px var(--card-shadow);
    border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center;
    text-align:center;
  }
  .punch{
    width:22px; height:22px; border-radius:50%; margin-bottom:14px;
    background:var(--backdrop);
    box-shadow:inset 0 2px 4px var(--punch-shadow), 0 1px 0 var(--scrim);
    border:1px solid var(--line-strong);
  }
  .qr-wrap{
    background:#fff; border-radius:14px; padding:14px;
    box-shadow:0 6px 16px -10px var(--qr-shadow);
    display:inline-flex; min-height:180px; min-width:180px;
    align-items:center; justify-content:center;
  }
  .qr-wrap.chrome-off{
    background:transparent; box-shadow:none; padding:0;
  }

  /* ---------- Toggle switch ---------- */
  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);
  }
  .toggle-row .toggle-label{ font-size:13px; font-weight:600; color:var(--ink); }
  .toggle-row .toggle-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .switch{
    flex:none; width:44px; height:26px; border-radius:99px; border:none;
    background:var(--line-strong); position:relative; cursor:pointer; padding:0;
    transition:background-color .15s ease;
  }
  .switch::before{
    content:""; position:absolute; top:3px; left:3px; width:20px; height:20px;
    border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3);
    transition:transform .15s ease;
  }
  .switch[aria-pressed="true"]{ background:var(--stamp); }
  .switch[aria-pressed="true"]::before{ transform:translateX(18px); }
  .switch:focus-visible{ outline:2px solid var(--stamp); outline-offset:2px; }
  #qr-canvas{ display:block; border-radius:4px; }
  .qr-placeholder{
    color:var(--ink-soft); font-size:12.5px; max-width:150px; line-height:1.5;
  }
  .tag-data{
    margin-top:14px; font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600;
    letter-spacing:.03em; word-break:break-all;
  }
  .tag-spec{
    margin-top:4px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);
    letter-spacing:.06em; text-transform:uppercase;
  }

  /* ---------- Error / void banner ---------- */
  .void-banner{
    margin-top:14px; border:1.5px dashed var(--void-ink); border-radius:12px;
    padding:12px 14px; background:rgba(178,58,46,.07);
    display:flex; gap:10px; align-items:flex-start;
  }
  .void-banner[hidden]{ display:none; }
  .void-stamp{
    font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; letter-spacing:.08em;
    color:#fff; background:var(--void); border-radius:5px; padding:3px 7px; flex:none;
    transform:rotate(-3deg);
  }
  .void-banner p{ margin:0; font-size:12.5px; line-height:1.5; color:var(--void-ink); }

  /* ---------- Bottom action bar ---------- */
  .action-bar{
    flex:none; padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:var(--card); border-top:1px solid rgba(33,29,23,.08);
    display:flex; gap:10px;
  }
  .btn{
    font-family:'IBM Plex Mono',monospace; font-size:13.5px; font-weight:600; letter-spacing:.02em;
    border-radius:12px; padding:13px 16px; border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform .1s ease, opacity .15s ease, background-color .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ flex:1.4; background:var(--stamp); color:#fff; }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; }
  .btn-primary:disabled:active{ transform:none; }
  .btn-secondary{
    flex:1; background:transparent; color:var(--ink); border:1.5px solid var(--line-strong);
  }
  .btn:focus-visible{ outline:2px solid var(--stamp); outline-offset:2px; }

  @media (prefers-reduced-motion:reduce){
    *{ transition:none !important; animation:none !important; }
  }

  ::-webkit-scrollbar{ width:0; height:0; }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>

  <header class="app-bar">
    <div class="app-bar-top">
      <div>
        <div class="eyebrow"><span class="dot"></span>Tag Printer</div>
        <h1>Version 1 QR</h1>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="icon-sun" width="17" height="17" viewBox="0 0 17 17" fill="none"><circle cx="8.5" cy="8.5" r="3.2" stroke="currentColor" stroke-width="1.4"/><path d="M8.5 1.2v1.8M8.5 14v1.8M2.2 8.5H.5M16.5 8.5h-1.7M3.7 3.7l1.3 1.3M12 12l1.3 1.3M13.3 3.7L12 5M5 12l-1.3 1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <svg class="icon-moon" width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M14.5 10.4A6 6 0 017 2.6a6.2 6.2 0 105.7 8.7c.6 0 1.2-.1 1.8-.3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <p>Strict 21×21 matrix · alphanumeric optimized</p>
  </header>

  <main class="phone-content">
    <section class="card">
      <label class="field-label" for="data-input">Data</label>
      <div class="input-row">
        <input
          type="text"
          id="data-input"
          class="mono"
          placeholder="e.g. EM12967120"
          value="EM12837318"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="clear-btn" type="button" aria-label="Clear data">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 1L13 13M13 1L1 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="meta-row">
        <span id="char-count">10 chars</span>
        <span id="mode-badge" class="mode-pill mono">ALPHA</span>
      </div>
      <div class="capacity-track"><div id="capacity-fill" class="capacity-fill"></div></div>

      <div class="settings-grid">
        <div>
          <span class="field-label">EC level</span>
          <div class="segmented" id="ec-group" role="group" aria-label="Error correction level">
            <button type="button" data-value="L" aria-pressed="true">L</button>
            <button type="button" data-value="M" aria-pressed="false">M</button>
            <button type="button" data-value="Q" aria-pressed="false">Q</button>
            <button type="button" data-value="H" aria-pressed="false">H</button>
          </div>
        </div>
        <div>
          <span class="field-label">Version</span>
          <div class="segmented" id="version-group" role="group" aria-label="QR version">
            <button type="button" data-value="1" aria-pressed="true">V1</button>
            <button type="button" data-value="auto" aria-pressed="false">Auto</button>
          </div>
        </div>
      </div>

      <div class="toggle-row">
        <div>
          <div class="toggle-label">Border</div>
          <div class="toggle-sub">Rounded card with a frame line</div>
        </div>
        <button id="border-toggle" class="switch" type="button" role="switch" aria-checked="false" aria-pressed="false" aria-label="Toggle border frame"></button>
      </div>
    </section>

    <div class="perf" aria-hidden="true"><div class="perf-line"></div></div>

    <section class="tag-card">
      <div class="punch"></div>
      <div id="qr-wrap" class="qr-wrap">
        <canvas id="qr-canvas" width="180" height="180"></canvas>
        <div id="qr-placeholder" class="qr-placeholder" hidden>Type a code above to print a tag</div>
      </div>
      <div id="tag-data" class="tag-data">EM12837318</div>
      <div id="tag-spec" class="tag-spec">V1 · EC-L · 21×21</div>

      <div id="void-banner" class="void-banner" hidden>
        <span class="void-stamp">VOID</span>
        <p id="void-text"></p>
      </div>
    </section>
  </main>

  <div class="action-bar">
    <button id="download-btn" class="btn btn-primary" type="button" disabled>
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 1v9m0 0L4 6.5M7.5 10l3.5-3.5M2 12.5h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Download PNG
    </button>
    <button id="copy-btn" class="btn btn-secondary" type="button">Copy</button>
  </div>

  // ---------- Theme toggle ----------
  var themeToggle = document.getElementById('theme-toggle');
  var themeColorMeta = document.getElementById('theme-color-meta');
  var THEME_COLORS = { light: '#EFE6D0', dark: '#1B1812' };

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function applyThemeChrome(theme) {
    themeColorMeta.setAttribute('content', THEME_COLORS[theme]);
    themeToggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
  }
  applyThemeChrome(currentTheme());

  themeToggle.addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('tag-printer-theme', next); } catch (e) {}
    applyThemeChrome(next);
  });

        buttons.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
        btn.setAttribute('aria-pressed', 'true');
        onChange(btn.getAttribute('data-value'));
      });
    });

  wireSegmented(versionGroup, function (val) { versionMode = val; renderQR(); });

      }
    }

    if (opts.border) {
      ctx.restore();
      var inset = opts.scale * 0.6;
      roundedRectPath(ctx, inset, inset, size - inset * 2, size - inset * 2, radius - inset);
      ctx.strokeStyle = opts.borderColor || '#D9D4C4';
      ctx.lineWidth = Math.max(1.5, opts.scale * 0.32);
      ctx.stroke();
    }
  }

  // ---------- Core render ----------
  function renderQR() {
    var raw = input.value.trim().toUpperCase();

    charCount.textContent = raw.length + (raw.length === 1 ? ' char' : ' chars');
    modeBadge.textContent = raw.length ? 'BYTE' : '—';

    if (versionMode === '1') {
      var max = CAPACITY_V1_BYTE[ecLevel];
      var pct = Math.min(100, (raw.length / max) * 100);
      capacityFill.style.width = pct + '%';
      capacityFill.classList.toggle('over', raw.length > max);
    } else {
      capacityFill.style.width = raw.length ? '8%' : '0%';
      capacityFill.classList.remove('over');
    }

    if (!raw) {
      canvas.hidden = true;
      qrPlaceholder.hidden = false;
      qrPlaceholder.textContent = 'Type a code above to print a tag';
      tagData.textContent = '—';
      tagSpec.textContent = 'Waiting for input';
      hideVoid();
      downloadBtn.disabled = true;
      return;
    }

    var typeNumber = versionMode === '1' ? 1 : 0;

    try {
      var qr = qrcode(typeNumber, ecLevel);
      qr.addData(raw, 'Byte');
      qr.make();

      canvas.hidden = false;
      qrPlaceholder.hidden = true;
      hideVoid();
      downloadBtn.disabled = false;
      tagData.textContent = raw;

      drawQR(qr, canvas, { margin: 3, scale: 8, dark: '#211D17', light: '#FFFFFF', border: borderEnabled });

      var count = qr.getModuleCount();
      var versionLabel = versionMode === '1' ? 'V1' : 'V' + ((count - 17) / 4);
      tagSpec.textContent = versionLabel + ' \u00b7 ' + ECC_LABEL[ecLevel] + ' \u00b7 ' + count + '\u00d7' + count;
    } catch (e) {
      canvas.hidden = true;
      qrPlaceholder.hidden = false;
      qrPlaceholder.textContent = 'Won\u2019t fit \u2014 adjust settings below';
      tagData.textContent = raw;
      tagSpec.textContent = 'Not generated';
      downloadBtn.disabled = true;

      var max = versionMode === '1' ? CAPACITY_V1_BYTE[ecLevel] : null;
      var overBy = max ? raw.length - max : null;
      var msg = max
        ? raw.length + ' characters is ' + overBy + ' too many for Version 1 at ' + ECC_LABEL[ecLevel] + ' (byte mode fits ' + max + '). Shorten the text, lower the EC level, or switch Version to Auto.'
        : 'This won\u2019t fit at the current settings. Try a lower EC level.';
      showVoid(msg);
    }
  }

  function showVoid(msg) {
    voidText.textContent = msg;
    voidBanner.hidden = false;
  }
  function hideVoid() {
    voidBanner.hidden = true;
  }

  // ---------- Download ----------
  downloadBtn.addEventListener('click', function () {
    var raw = input.value.trim().toUpperCase() || 'code';
    var link = document.createElement('a');
    link.download = 'QR_V1_' + raw + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // ---------- Copy ----------
  copyBtn.addEventListener('click', function () {
    var raw = input.value.trim().toUpperCase();
    if (!raw) return;
    navigator.clipboard.writeText(raw).then(function () {
      var original = copyBtn.textContent;
      copyBtn.textContent = 'Copied';
      setTimeout(function () { copyBtn.textContent = original; }, 1200);
    });
  });

  // ---------- Initial paint ----------
  renderQR();
</script>
</body>
</html>
